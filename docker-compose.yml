services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudbyte
      POSTGRES_PASSWORD: cloudbyte
      POSTGRES_DB: cloudbyte
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbyte -d cloudbyte"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cloudbyte
      POSTGRES_PASSWORD: cloudbyte
      POSTGRES_DB: cloudbyte_api
    ports:
      - "5433:5432"
    volumes:
      - api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbyte -d cloudbyte_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://cloudbyte:cloudbyte@api-postgres:5432/cloudbyte_api
      VECTOR_DATABASE_URL: postgresql://cloudbyte:cloudbyte@api-postgres:5432/cloudbyte_api
    depends_on:
      api-postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/test:/app/apps/api/test
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json
      - ./packages/shared/src:/app/packages/shared/src
      - ~/.aws:/root/Users/vince/.aws:ro

  internal-api-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cloudbyte
      POSTGRES_PASSWORD: cloudbyte
      POSTGRES_DB: cloudbyte_internal_api
    ports:
      - "5434:5432"
    volumes:
      - internal_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbyte -d cloudbyte_internal_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  internal-api:
    build:
      context: .
      dockerfile: apps/internal-api/Dockerfile
      args:
        DATABASE_URL: postgresql://cloudbyte:cloudbyte@internal-api-postgres:5432/cloudbyte_internal_api
    ports:
      - "4000:4000"
    env_file:
      - apps/internal-api/.env
    environment:
      DATABASE_URL: postgresql://cloudbyte:cloudbyte@internal-api-postgres:5432/cloudbyte_internal_api
    depends_on:
      internal-api-postgres:
        condition: service_healthy
    volumes:
      - ./apps/internal-api/src:/app/apps/internal-api/src
      - ./apps/internal-api/prisma:/app/apps/internal-api/prisma

  compression-worker:
    build:
      context: .
      dockerfile: apps/compression-worker/Dockerfile
    env_file:
      - apps/compression-worker/.env.example
    environment:
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_PREVIEW_BUCKET: ${AWS_PREVIEW_BUCKET:-}
      COMPRESSION_QUEUE_URL: ${COMPRESSION_QUEUE_URL:-}
      INTERNAL_API_URL: http://internal-api:4000
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-}
      INTERNAL_API_CLIENT_SECRET: ${INTERNAL_API_CLIENT_SECRET:-}
      COMPRESSION_WORKER_POLL_INTERVAL_MS: 2000
    depends_on:
      - internal-api
    volumes:
      - ./apps/compression-worker/src:/app/apps/compression-worker/src

  indexing-worker:
    build:
      context: .
      dockerfile: apps/indexing-worker/Dockerfile
    env_file:
      - apps/internal-api/.env
    environment:
      AWS_REGION: us-east-1
      INTERNAL_API_URL: http://internal-api:4000
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-}
      INTERNAL_API_CLIENT_SECRET: ${INTERNAL_API_CLIENT_SECRET:-}
      INDEXING_WORKER_POLL_INTERVAL_MS: 2000
    depends_on:
      - internal-api
    volumes:
      - ./apps/indexing-worker/src:/app/src

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    env_file:
      - apps/mcp-server/.env
    environment:
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      INTERNAL_API_URL: http://internal-api:4000
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-}
      INTERNAL_API_CLIENT_SECRET: ${INTERNAL_API_CLIENT_SECRET:-}
    depends_on:
      - internal-api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - apps/web/.env
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src

  s3-upload-metadata-lambda:
    build:
      context: ./infra/lambdas/s3_upload_metadata
      dockerfile: Dockerfile
    environment:
      AWS_REGION: us-east-1
      INTERNAL_API_URL: http://internal-api:4000
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-}
      INTERNAL_API_CLIENT_SECRET: ${INTERNAL_API_CLIENT_SECRET:-}
      COMPRESSION_QUEUE_URL: ${COMPRESSION_QUEUE_URL:-}
      UPLOAD_SIZE_THRESHOLD_BYTES: ${UPLOAD_SIZE_THRESHOLD_BYTES:-20971520}
    depends_on:
      - internal-api

  pending-file-cleanup-lambda:
    build:
      context: ./infra/lambdas/pending_file_cleanup
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_URL: http://internal-api:4000
      INTERNAL_API_CLIENT_ID: ${INTERNAL_API_CLIENT_ID:-}
      INTERNAL_API_CLIENT_SECRET: ${INTERNAL_API_CLIENT_SECRET:-}
    depends_on:
      - internal-api

volumes:
  postgres_data:
  api_postgres_data:
  internal_api_postgres_data:
